services:
  - type: web
    name: ai-resume-screening-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-resume-screening-three-kohl.vercel.app
