name: HireLens checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.13.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12.8
      - run: uv sync --frozen
      - run: uv run --frozen python -m src.warm_cache
      - run: HF_HUB_OFFLINE=1 uv run --frozen pytest -q
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages --progress-spinner off
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
