[project]
name = "ai-resume-screening"
version = "1.0.0"
description = "AI-based Resume Screening and Ranking System"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.6.0; sys_platform != 'linux'",
    "torch==2.6.0+cpu; sys_platform == 'linux'",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.3.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.vercel]
entrypoint = "src.api:app"
